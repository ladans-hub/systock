name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Systock-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
      - run: flutter build macos --debug

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/x64/runner/Release/systock.exe")) {
            throw "systock.exe não foi encontrado após a compilação Windows."
          }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/Systock-Windows-release.zip" -Force
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows/installer/vc_redist.x64.exe"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows/installer/systock.iss"
          if (!(Test-Path "build/windows-installer/Systock-Setup.exe")) {
            throw "Systock-Setup.exe não foi gerado."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Systock-Windows-release
          path: build/Systock-Windows-release.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Systock-Windows-installer
          path: build/windows-installer/Systock-Setup.exe
          if-no-files-found: error
