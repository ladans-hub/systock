name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Create Android build defines
        env:
          GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('defines.json', 'w') as f:
              json.dump({k: os.environ.get(k, '') for k in ('GOOGLE_ANDROID_CLIENT_ID', 'GOOGLE_SERVER_CLIENT_ID')}, f)
          PY
      - run: flutter build apk --release --dart-define-from-file=defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: Systock-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - name: Create Apple build defines
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_APPLE_CLIENT_ID: ${{ vars.GOOGLE_APPLE_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os
          keys = ('GOOGLE_IOS_CLIENT_ID', 'GOOGLE_APPLE_CLIENT_ID', 'GOOGLE_DESKTOP_CLIENT_ID', 'GOOGLE_DESKTOP_CLIENT_SECRET')
          with open('defines.json', 'w') as f:
              json.dump({k: os.environ.get(k, '') for k in keys}, f)
          PY
      - run: flutter build ios --debug --no-codesign --dart-define-from-file=defines.json
      - run: flutter build macos --debug --dart-define-from-file=defines.json

  ios-release:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable Xcode
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Install distribution signing credentials
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_APP_STORE_PROFILE_BASE64 GOOGLE_IOS_CLIENT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name in repository Actions secrets/variables (see scripts/ci/README.md)."
              exit 1
            fi
          done
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/systock.p12"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/systock.mobileprovision"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          keychain_path="$RUNNER_TEMP/systock-signing.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/systock.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          python3 scripts/ci/prepare_ios_release.py
      - run: flutter pub get
      - name: Archive release with defines
        run: >-
          flutter build ipa --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define-from-file=defines.json
      - name: Sign and export App Store IPA
        run: >-
          xcodebuild -exportArchive
          -archivePath build/ios/archive/Runner.xcarchive
          -exportPath build/ios/ipa
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: Systock-iOS-AppStore-release
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/systock-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/systock.p12" "$RUNNER_TEMP/systock.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist" defines.json
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - name: Create Windows build defines
        shell: pwsh
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          @{
            GOOGLE_DESKTOP_CLIENT_ID = $env:GOOGLE_DESKTOP_CLIENT_ID
            GOOGLE_DESKTOP_CLIENT_SECRET = $env:GOOGLE_DESKTOP_CLIENT_SECRET
          } | ConvertTo-Json | Set-Content -Path defines.json -Encoding UTF8
      - run: flutter build windows --release --dart-define-from-file=defines.json
      - name: Package Windows release
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/x64/runner/Release/systock.exe")) {
            throw "systock.exe não foi encontrado após a compilação Windows."
          }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/Systock-Windows-release.zip" -Force
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows/installer/vc_redist.x64.exe"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows/installer/systock.iss"
          if (!(Test-Path "build/windows-installer/Systock-Setup.exe")) {
            throw "Systock-Setup.exe não foi gerado."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Systock-Windows-release
          path: build/Systock-Windows-release.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Systock-Windows-installer
          path: build/windows-installer/Systock-Setup.exe
          if-no-files-found: error
