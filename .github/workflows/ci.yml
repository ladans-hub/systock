name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Create Android build defines
        env:
          GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('defines.json', 'w') as f:
              json.dump({k: os.environ.get(k, '') for k in ('GOOGLE_ANDROID_CLIENT_ID', 'GOOGLE_SERVER_CLIENT_ID')}, f)
          PY
      - run: flutter build apk --release --dart-define-from-file=defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: Systock-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - name: Create Apple build defines
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_APPLE_CLIENT_ID: ${{ vars.GOOGLE_APPLE_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os
          keys = ('GOOGLE_IOS_CLIENT_ID', 'GOOGLE_APPLE_CLIENT_ID', 'GOOGLE_DESKTOP_CLIENT_ID', 'GOOGLE_DESKTOP_CLIENT_SECRET')
          with open('defines.json', 'w') as f:
              json.dump({k: os.environ.get(k, '') for k in keys}, f)
          PY
      - run: flutter build ios --debug --no-codesign --dart-define-from-file=defines.json
      - run: flutter build macos --debug --dart-define-from-file=defines.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - name: Create Windows build defines
        shell: pwsh
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          @{
            GOOGLE_DESKTOP_CLIENT_ID = $env:GOOGLE_DESKTOP_CLIENT_ID
            GOOGLE_DESKTOP_CLIENT_SECRET = $env:GOOGLE_DESKTOP_CLIENT_SECRET
          } | ConvertTo-Json | Set-Content -Path defines.json -Encoding UTF8
      - run: flutter build windows --release --dart-define-from-file=defines.json
      - name: Package Windows release
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/x64/runner/Release/Systock.exe")) {
            throw "Systock.exe não foi encontrado após a compilação Windows."
          }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/Systock-Windows-release.zip" -Force
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows/installer/vc_redist.x64.exe"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows/installer/systock.iss"
          if (!(Test-Path "build/windows-installer/Systock-Setup.exe")) {
            throw "Systock-Setup.exe não foi gerado."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Systock-Windows-release
          path: build/Systock-Windows-release.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Systock-Windows-installer
          path: build/windows-installer/Systock-Setup.exe
          if-no-files-found: error
